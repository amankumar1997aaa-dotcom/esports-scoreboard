<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esports Scoreboard</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0f;--gold:#f0b429;--tx:#f4efe6;--mut:#b9a98d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Oswald","Bebas Neue",Impact,"Arial Narrow",sans-serif;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 auto 10px;max-width:1100px;font-family:system-ui,sans-serif;font-size:13px;align-items:center}
button{background:var(--gold);color:#000;border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer;font-family:system-ui,sans-serif;transition:transform .15s}
button:hover{transform:scale(1.05)}button.g{background:#2a2218;color:var(--tx)}button.red{background:#7a1f1f;color:#fff}
.tabs button{background:#2a2218;color:var(--tx);font-size:15px;padding:10px 14px;letter-spacing:1px;font-family:inherit}
.tabs button.on{background:var(--gold);color:#000;animation:tabp 1.8s ease-in-out infinite}
@keyframes tabp{0%,100%{box-shadow:0 0 6px #f0b42966}50%{box-shadow:0 0 22px #f0b429}}
#stage{position:relative;overflow:hidden;border:1px solid #3a2c12;padding:22px;max-width:1100px;margin:auto;background:linear-gradient(120deg,#14100a,#3a2808,#0b0b0f,#2a1d06,#14100a);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#stage::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 40deg,#f0b42918 50deg,transparent 62deg 180deg,#f0b42912 200deg,transparent 216deg);animation:beam 18s linear infinite;pointer-events:none}
@keyframes beam{to{transform:rotate(360deg)}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:0;animation:rise 7s linear infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.8}100%{transform:translateY(-900px) scale(1.4);opacity:0}}
.head{position:relative;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;animation:drop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
#t1{color:var(--gold);font-size:36px;letter-spacing:2px;text-transform:uppercase;animation:tglow 2.4s ease-in-out infinite}
@keyframes tglow{0%,100%{text-shadow:0 0 8px #f0b42966}50%{text-shadow:0 0 30px #f0b429,0 0 5px #fff8}}
#t2{font-size:24px}.brand{text-align:right}#ev{font-size:26px;font-style:italic;font-weight:700}#org{font-size:14px;color:var(--mut)}
.grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.team{position:relative;overflow:hidden;display:grid;grid-template-columns:150px 1fr;align-items:center;background:linear-gradient(90deg,#0f0c08,#1b140c);border:1px solid #3a2c12;min-height:104px;animation:in .6s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:var(--d,0s);transition:transform .25s,box-shadow .25s}
.team:nth-child(even){--from:60px}.team:nth-child(odd){--from:-60px}
@keyframes in{from{transform:perspective(700px) rotateX(-80deg) translateX(var(--from,-40px));opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
.team:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 6px 22px #f0b42944}
.team.r1{background:linear-gradient(90deg,#c58b17 0%,#3a2a0a 28%,#14100a 60%);border-color:var(--gold);--g:#f0b429;animation:in .6s both,glow 2s ease-in-out infinite;animation-delay:var(--d,0s),0s}
.team.r2{background:linear-gradient(90deg,#8d939c 0%,#2c2f35 28%,#14100a 60%);border-color:#a8aeb8;--g:#c4cad4;animation:in .6s both,glow 2.6s ease-in-out infinite;animation-delay:var(--d,0s),0s}
.team.r3{background:linear-gradient(90deg,#9a5a2a 0%,#3a2312 28%,#14100a 60%);border-color:#b8733a;--g:#d98b4a;animation:in .6s both,glow 3.2s ease-in-out infinite;animation-delay:var(--d,0s),0s}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--g)}50%{box-shadow:0 0 22px var(--g)}}
.team.r1::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,#fff6,transparent);transform:skewX(-20deg);animation:sweep 3s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,60%{left:-80px}100%{left:110%}}
.team.r1::before{content:"👑";position:absolute;top:1px;left:12px;font-size:22px;z-index:2;animation:crown 2s ease-in-out infinite;pointer-events:none}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-5px) rotate(12deg)}}
.quiet .team,.quiet .pcard,.quiet .chip{animation:none}.quiet .team.r1{animation:glow 2s ease-in-out infinite}.quiet .team.r2{animation:glow 2.6s ease-in-out infinite}.quiet .team.r3{animation:glow 3.2s ease-in-out infinite}.quiet .rank{animation:none!important}
.left{display:flex;align-items:center;justify-content:space-around;padding:6px}
.logo{width:66px;height:66px;background:#000;border:2px solid #6b4e17;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold);overflow:hidden;animation:float 3.5s ease-in-out infinite}
.team:nth-child(even) .logo{animation-delay:-1.7s}.logo:hover{animation:flip .8s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flip{to{transform:rotateY(360deg)}}
.logo img{width:100%;height:100%;object-fit:cover}
.rank{width:50px;font-size:54px;font-weight:700;font-style:italic;text-align:center;animation:pop .7s both;animation-delay:calc(var(--d,0s) + .3s)}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.team.r1 .rank,.team.r2 .rank,.team.r3 .rank{animation:pop .7s both,rpulse 2s ease-in-out infinite;animation-delay:calc(var(--d,0s) + .3s),1.2s;text-shadow:0 0 14px var(--g)}
@keyframes rpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.right{padding:8px 14px 8px 0}
.tn{font-size:22px;text-transform:uppercase}.sub{color:var(--mut);font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.pl{display:flex;justify-content:space-between;align-items:center;font-size:17px;gap:6px}
.pl.m{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}.pl.m b{color:var(--gold);font-size:20px}
.el{display:flex;align-items:baseline;gap:5px;color:var(--mut);font-size:12px}.el b{color:var(--gold);font-size:24px}
.tot{text-align:right;font-size:12px;color:var(--mut);margin-top:2px}.tot b{color:var(--gold);font-size:17px}.final .tot b,.mvp .tot b{font-size:26px}
.mvp1{grid-column:1/-1;min-height:160px;grid-template-columns:240px 1fr}.mvp1 .tn{font-size:36px;color:var(--gold)}.mvp1 .logo{width:96px;height:96px;font-size:30px}.mvp1 .rank{font-size:84px;width:90px}
@media(max-width:760px){.mvp1{grid-template-columns:150px 1fr}.mvp1 .logo{width:66px;height:66px}.mvp1 .rank{font-size:54px;width:50px}.mvp1 .tn{font-size:26px}}
.pcard{--from:-40px;position:relative;background:linear-gradient(90deg,#0f0c08,#1b140c);border:1px solid #3a2c12;padding:16px;animation:in .6s both;animation-delay:var(--d,0s)}
.pcard h3{margin:0 0 10px;color:var(--gold);letter-spacing:2px;font-size:20px;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.chip{display:flex;justify-content:space-between;align-items:baseline;background:#000a;border:1px solid #4a3714;padding:8px 10px;animation:pop .5s both;animation-delay:var(--d,0s)}
.chip span{color:var(--mut);font-size:14px}.chip b{color:var(--gold);font-size:26px}.chip.t1{border-color:var(--gold)}.chip.t2{border-color:#a8aeb8}.chip.t3{border-color:#b8733a}
.big{font-size:24px}.big b{color:var(--gold);font-size:46px}
.pcard ul{margin:0;padding-left:20px;line-height:1.7;font-size:17px}

/* background image */
#vbg{position:fixed;inset:0;z-index:-2;background:#000 center/cover no-repeat;pointer-events:none}
#vdim{position:fixed;inset:0;z-index:-1;background:#0b0b0f;opacity:.55;pointer-events:none;transition:opacity .4s}
body.hasbg #stage{background:linear-gradient(120deg,#14100a73,#3a280873,#0b0b0f73,#2a1d0673,#14100a73);background-size:300% 300%}
body.hasbg .team:not(.r1,.r2,.r3){background:linear-gradient(90deg,#0f0c08e0,#1b140ce0)}
body.hasbg .pcard{background:linear-gradient(90deg,#0f0c08e0,#1b140ce0)}
body{padding:8px 0 0}
.bar{max-width:none;margin:0 0 8px;padding:0 14px}
#stage{max-width:none;margin:0;border:0}
#fitbox{position:relative;overflow:hidden}
body.fit{overflow:hidden}
body.pres{padding:0}
/* live animations */
.chip2{position:absolute;top:8px;right:14px;z-index:3;font:700 24px/1 "Oswald","Bebas Neue",Impact,sans-serif;letter-spacing:1px;color:#7bd88f;text-shadow:0 0 14px #7bd88faa;pointer-events:none;animation:chipf 2.6s ease-out forwards}
.chip2.dn{color:#ff7a7a;text-shadow:0 0 14px #ff7a7aaa}
@keyframes chipf{0%{transform:translateY(16px) scale(.5);opacity:0}12%{transform:translateY(0) scale(1.25);opacity:1}24%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
#wipe{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent 35%,#f0b42955 50%,#fff3 52%,transparent 65%);transform:translateX(-100%)}
#wipe.run{animation:wipe .9s cubic-bezier(.4,0,.2,1)}
@keyframes wipe{0%{transform:translateX(-100%);opacity:1}100%{transform:translateX(100%);opacity:1}}
.lp{display:inline-block;background:#d62828;color:#fff;font:700 12px/1 system-ui,sans-serif;letter-spacing:2px;padding:4px 9px;border-radius:3px;margin-bottom:6px;animation:lpp 1.4s ease-in-out infinite}
.lp[hidden]{display:none}
@keyframes lpp{0%,100%{box-shadow:0 0 0 0 #d6282899}50%{box-shadow:0 0 14px 4px #d6282866}}
#ticker{position:relative;overflow:hidden;margin-top:14px;height:34px;display:flex;align-items:center;background:#0008;border-top:1px solid #4a3714;border-bottom:1px solid #4a3714;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx);white-space:nowrap}
#ticker::before,#ticker::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
#ticker::before{left:0;background:linear-gradient(90deg,#0b0b0f,transparent)}#ticker::after{right:0;background:linear-gradient(270deg,#0b0b0f,transparent)}
.tk{display:flex;width:max-content;animation:tick var(--dur,40s) linear infinite}
.tk span{padding-right:60px}.tk b{color:var(--gold)}
@keyframes tick{to{transform:translateX(-50%)}}
#ban{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;background:radial-gradient(circle,#000a 0,#000e 75%);transition:opacity .4s}
#ban.show{opacity:1}
#ban .bi{text-align:center;padding:0 16px}
#ban.show .bi{animation:bpop .9s cubic-bezier(.2,1.4,.3,1)}
@keyframes bpop{from{transform:scale(.4) rotate(-6deg);opacity:0;filter:blur(10px)}}
.bk{font-size:clamp(20px,4vw,52px);letter-spacing:12px;color:var(--mut)}
.bn{font-size:clamp(40px,10vw,160px);font-weight:700;font-style:italic;color:var(--gold);text-transform:uppercase;line-height:1.05;animation:tglow 2.4s ease-in-out infinite}
.bs{font-size:clamp(18px,3vw,42px);margin-top:10px;color:var(--tx)}
#conn{margin-left:auto;font-size:12px;color:var(--mut)}#conn.ok{color:#7bd88f}#conn.off{color:#ff8a8a}

body.pres .bar{display:none}#exitp{display:none;position:fixed;bottom:8px;right:8px;z-index:70;opacity:.25}#exitp:hover{opacity:1}body.pres #exitp{display:block}
#spot{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle 240px at var(--x,50%) var(--y,50%),#f0b42922,transparent)}
body.hasptr #spot{opacity:1}
#toast{position:fixed;top:14px;left:50%;z-index:60;transform:translate(-50%,-140%);background:#14100a;border:1px solid var(--gold);color:var(--gold);padding:10px 20px;font-size:20px;letter-spacing:2px;text-transform:uppercase;box-shadow:0 0 24px #f0b42988;transition:transform .5s cubic-bezier(.2,1.3,.4,1);pointer-events:none}
#toast.show{transform:translate(-50%,0)}
.lp.flash{animation:lpf .7s ease-out}
@keyframes lpf{0%{transform:scale(1.5);background:#fff;color:#d62828}100%{transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="vbg"></div>
<div id="vdim"></div>
<div class="bar tabs" id="tabs"></div>
<div class="bar">
  <button class="g" onclick="show('')">▶ Replay</button>
  <button class="g" onclick="show('rev')">🏁 Reveal last → 1st</button>
  <button class="g" onclick="celebrate()">🎉 Celebrate</button>
  <button class="g" onclick="pres(1)">📺 Full screen</button>
  <span id="conn"></span><span id="ago" style="color:var(--mut);font-size:12px"></span>
</div>
<button id="exitp" class="g" onclick="pres(0)">✕ Exit presentation</button>
<canvas id="cf" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50"></canvas>
<div id="fitbox"><div id="stage"><div id="wipe"></div>
  <div class="head"><div><div id="t1"></div><div id="t2"></div></div><div class="brand"><div id="lp" class="lp" hidden>● LIVE</div><div id="ev"></div><div id="org"></div></div></div>
  <div class="grid" id="grid"></div>
  <div id="ticker"><div class="tk" id="tk"></div></div>
</div></div>
<div id="spot"></div><div id="toast"></div>
<div id="ban"><div class="bi"><div class="bk" id="bk"></div><div class="bn" id="bn"></div><div class="bs" id="bs"></div></div></div>
<script src="config.js"></script>

const NAMES=["K9 Esports","Nebula Esports","iQOO TG","Play-X Esports","Rackers Esports","Cosmic Esports","RNTX","Team Apex Gaming","Mythic Blaze","Aerobotz","Team Elite","Olympians"];
const defaults=()=>({title:'Battle Royale',event:'YOUR EVENT NAME',org:'Organised by Your College',maps:['Bermuda','Purgatory','Kalahari'],subs:['','','','','',''],
  teams:NAMES.map(n=>({name:n,logo:'',p:['Player 1','Player 2']})),
  d:[0,1,2].map(()=>({rank:NAMES.map((_,i)=>i+1),k:NAMES.map(()=>['',''])})),pp:[12,9,8,7,6,5,4,3,2,1,0,0],kp:1,mvpN:10,
  rules:'Total points = placement points + kill points from all 3 maps.\nTie-break: most Booyahs → most kills → most placement points.\nMVP = the player with the most eliminations across all maps.',
  bg:{on:true,url:(CFG.background!==undefined?CFG.background:'bg.png'),dim:55}});
function norm(o){const d=defaults(),s=Object.assign(d,o||{});s.bg=Object.assign({},d.bg,s.bg||{});delete s.vid;return s}
let S=defaults(),cur=0;
try{const c=localStorage.getItem(CK);if(c)S=norm(JSON.parse(c))}catch(e){}

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const ini=n=>n.split(/\s+/).map(w=>w[0]||'').join('').slice(0,3).toUpperCase();
const NT=()=>S.teams.length;
const kills=(m,i)=>S.d[m].k[i].reduce((a,v)=>a+(parseInt(v)||0),0);
const place=(m,i)=>{const r=S.d[m].rank[i];return r>=1&&r<=NT()?(S.pp[r-1]||0):0};
const mpts=(m,i)=>place(m,i)+kills(m,i)*S.kp;
const cls=r=>r>=1&&r<=3?' r'+r:'';
const logo=t=>`<div class="logo">${t.logo?`<img src="${t.logo}" alt="">`:esc(ini(t.name))}</div>`;
const subOf=i=>S.subs[i]||(i<3?`Match ${i+1} · ${S.maps[i]}`:['','','','Final Standings','MVP Players','Point System'][i]);

function tabs(){$('tabs').innerHTML=S.maps.map((m,i)=>`<button class="${cur===i?'on':''}" onclick="go(${i})">MAP ${i+1} · ${esc(m.toUpperCase())}</button>`).join('')+
  [['🏆 FINAL',3],['⭐ MVP',4],['📊 POINT SYSTEM',5]].map(([l,i])=>`<button class="${cur===i?'on':''}" onclick="go(${i})">${l}</button>`).join('')}
function hdr(){$('t1').textContent=S.title;$('t2').textContent=subOf(cur);$('ev').textContent=S.event;$('org').textContent=S.org}

function go(i,q){cur=i;tabs();hdr();render('');ticker();if(!q){wipe();if(i===3||i===4)setTimeout(celebrate,900)}}
function wipe(){const w=$('wipe');w.classList.remove('run');void w.offsetWidth;w.classList.add('run')}
function standings(){return S.teams.map((t,i)=>{let pts=0,k=0,w=0,pl=0;for(let m=0;m<3;m++){pts+=mpts(m,i);k+=kills(m,i);pl+=place(m,i);if(S.d[m].rank[i]===1)w++}return{i,pts,k,w,pl}}).sort((a,b)=>b.pts-a.pts||b.w-a.w||b.k-a.k||b.pl-a.pl||a.i-b.i)}
function mvpList(){const P=[];S.teams.forEach((t,i)=>t.p.forEach((n,j)=>P.push({n,t:t.name,k:[0,1,2].reduce((a,m)=>a+(parseInt(S.d[m].k[i][j])||0),0)})));return P.sort((a,b)=>b.k-a.k)}
const eh=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function ticker(){const T=$('ticker'),A=standings(),any=A.some(a=>a.pts>0);
  T.style.display=cur===3?'none':'flex';
  const seg=[`<b>🔥 ${eh(S.event)}</b>`];
  if(any){A.slice(0,5).forEach((a,p)=>seg.push(`#${p+1} <b>${eh(S.teams[a.i].name)}</b> ${a.pts} pts`));const m=mvpList()[0];if(m&&m.k>0)seg.push(`⭐ MVP <b>${eh(m.n)}</b> ${m.k} kills`)}else seg.push('Results coming soon');
  const h='<span>'+seg.join(' &nbsp;·&nbsp; ')+'</span>';$('tk').innerHTML=h+h;
  $('tk').style.setProperty('--dur',Math.max(20,Math.round(seg.join(' ').length*.35))+'s');setTimeout(fit,0)}
let bt;
function banner(){if(cur!==3&&cur!==4)return;let k,n,t;
  if(cur===3){const a=standings()[0];if(!a||!a.pts)return;k='🏆 CHAMPIONS';n=S.teams[a.i].name;t=a.pts+' points · '+a.k+' kills'+(a.w?' · '+a.w+' Booyah':'')}
  else{const m=mvpList()[0];if(!m||!m.k)return;k='⭐ MVP';n=m.n;t=m.t+' · '+m.k+' eliminations'}
  $('bk').textContent=k;$('bn').textContent=n;$('bs').textContent=t;const B=$('ban');B.classList.remove('show');void B.offsetWidth;B.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>B.classList.remove('show'),4500)}
function celebrate(){confetti();banner()}
function notify(e,dp,dr){if(!dp&&!dr)return;const p=[];if(dp)p.push((dp>0?'+':'')+dp);if(dr)p.push((dr>0?'▲':'▼')+Math.abs(dr));
  const s=document.createElement('span');s.className='chip2'+((dp<0||dr<0)&&!(dp>0||dr>0)?' dn':'');s.textContent=p.join('  ');e.appendChild(s);setTimeout(()=>s.remove(),2700);
  if(dp>0||dr>0)e.animate([{filter:'brightness(1)'},{filter:'brightness(1.7)',boxShadow:'0 0 34px 6px #f0b429'},{filter:'brightness(1)'}],{duration:1000,easing:'ease-out'})}
function snap(){const m={};[...$('grid').children].forEach(e=>{const b=e.querySelector('.tot b'),r=e.querySelector('.rank');m[e.dataset.id]={rect:e.getBoundingClientRect(),v:b?(parseInt(b.dataset.v!==undefined?b.dataset.v:b.textContent)||0):0,r:r?(parseInt(r.textContent)||99):99}});return m}

function render(mode){
  const g=$('grid'),q=mode==='q';let html='';
  const dly=(pos,n)=>q?0:mode==='rev'?(n-1-pos)*.45+.2:pos*.08;
  g.className='grid'+(q?' quiet':'');
  if(cur<3){
    const o=S.teams.map((_,i)=>i).sort((a,b)=>S.d[cur].rank[a]-S.d[cur].rank[b]||a-b);
    html=o.map((ti,pos)=>{const t=S.teams[ti],r=S.d[cur].rank[ti];
      return `<div class="team${cls(r)}" data-id="${ti}" style="--d:${dly(pos,o.length)}s"><div class="left">${logo(t)}<div class="rank">${r>=99?'–':r}</div></div>
      <div class="right"><div class="tn">${esc(t.name)}</div>
      ${t.p.map((p,j)=>`<div class="pl"><span>${esc(p)}</span><span class="el"><b>${parseInt(S.d[cur].k[ti][j])||0}</b> Eliminations</span></div>`).join('')}
      <div class="tot">Team total: <b>${kills(cur,ti)}</b></div></div></div>`}).join('');
  }else if(cur===3){
    const A=S.teams.map((t,i)=>{let pts=0,k=0,w=0,pl=0;for(let m=0;m<3;m++){pts+=mpts(m,i);k+=kills(m,i);pl+=place(m,i);if(S.d[m].rank[i]===1)w++}return{i,pts,k,w,pl}})
      .sort((a,b)=>b.pts-a.pts||b.w-a.w||b.k-a.k||b.pl-a.pl||a.i-b.i);
    g.className+=' final';
    html=A.map((s,pos)=>{const t=S.teams[s.i],r=pos+1;
      return `<div class="team${cls(r)}" data-id="${s.i}" style="--d:${dly(pos,A.length)}s"><div class="left">${logo(t)}<div class="rank">${r}</div></div>
      <div class="right"><div class="tn">${esc(t.name)}</div>
      ${S.maps.map((m,k)=>`<div class="pl m"><span>${esc(m)}</span><span><b class="cnt" data-v="${mpts(k,s.i)}">0</b> pts · ${kills(k,s.i)} kills</span></div>`).join('')}
      <div class="tot">${s.w?`🏆 ${s.w} Booyah · `:''}${s.k} kills · TOTAL <b class="cnt" data-v="${s.pts}">0</b></div></div></div>`}).join('');
  }else if(cur===4){
    const P=[];S.teams.forEach((t,i)=>t.p.forEach((n,j)=>{const ks=[0,1,2].map(m=>parseInt(S.d[m].k[i][j])||0);P.push({i,j,n,t,ks,tot:ks.reduce((a,b)=>a+b,0),best:Math.max(...ks)})}));
    P.sort((a,b)=>b.tot-a.tot||b.best-a.best||a.i-b.i||a.j-b.j);
    const L=P.slice(0,Math.max(1,parseInt(S.mvpN)||10));g.className+=' mvp';
    html=L.map((p,pos)=>{const r=pos+1;
      return `<div class="team${cls(r)}${r===1?' mvp1':''}" data-id="${p.i}-${p.j}" style="--d:${dly(pos,L.length)}s"><div class="left">${logo(p.t)}<div class="rank">${r}</div></div>
      <div class="right"><div class="tn">${r===1?'⭐ MVP · ':''}${esc(p.n)}</div><div class="sub">${esc(p.t.name)}</div>
      ${S.maps.map((m,k)=>`<div class="pl m"><span>${esc(m)}</span><span><b>${p.ks[k]}</b> kills</span></div>`).join('')}
      <div class="tot">TOTAL ELIMINATIONS <b class="cnt" data-v="${p.tot}">0</b></div></div></div>`}).join('');
  }else{
    const N=NT(),rules=String(S.rules||'').split('\n').filter(x=>x.trim());
    html=`<div class="pcard" style="grid-column:1/-1;--d:0s"><h3>PLACEMENT POINTS</h3><div class="chips">${Array.from({length:N},(_,i)=>`<div class="chip${i<3?' t'+(i+1):''}" style="--d:${q?0:.3+i*.05}s"><span>#${i+1}</span><b>${S.pp[i]||0}</b></div>`).join('')}</div></div>
    <div class="pcard" style="--d:${q?0:.25}s"><h3>KILL POINTS</h3><div class="big">1 Elimination = <b>${S.kp}</b> pt</div></div>
    <div class="pcard" style="--d:${q?0:.4}s"><h3>FORMAT</h3><div class="big" style="font-size:20px;line-height:1.5">${S.maps.map(esc).join(' → ')}<br><span style="color:var(--mut);font-size:15px">Final = combined total of all ${S.maps.length} maps</span></div></div>
    <div class="pcard" style="grid-column:1/-1;--d:${q?0:.55}s"><h3>RULES</h3><ul>${rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`;
  }
  g.innerHTML=html;countUp(q);
}
function show(mode){render(mode);if(mode){const c=[...document.querySelectorAll('.team,.pcard')];c.forEach(e=>e.style.opacity=0);requestAnimationFrame(()=>c.forEach(e=>e.style.opacity=''));if(cur===3||cur===4)setTimeout(celebrate,Math.min(c.length,NT())*450+1200)}}

function flip(){const g=$('grid'),f=snap();render('q');ticker();
  [...g.children].forEach(e=>{const a=f[e.dataset.id];if(!a)return;const b=e.getBoundingClientRect();
    if(a.rect.top!==b.top||a.rect.left!==b.left)e.animate([{transform:`translate(${(a.rect.left-b.left)/SC}px,${(a.rect.top-b.top)/SC}px)`},{transform:'none'}],{duration:600,easing:'cubic-bezier(.2,.9,.3,1.1)'});
    const t=e.querySelector('.tot b'),r=e.querySelector('.rank'),nv=t?(parseInt(t.dataset.v!==undefined?t.dataset.v:t.textContent)||0):0,nr=r?(parseInt(r.textContent)||99):99;
    notify(e,nv-a.v,(a.r<99&&nr<99)?a.r-nr:0)})}
/* ---------- full screen: fills the display and scales everything to fit, no scrolling ---------- */
let SC=1;
function fit(){const st=$('stage'),fb=$('fitbox'),B=document.body,on=B.classList.contains('pres')||innerWidth>=760;
  B.classList.toggle('fit',on);
  if(!on){fb.style.height='';st.style.width=st.style.transform=st.style.minHeight=st.style.transformOrigin='';SC=1;return}
  scrollTo(0,0);st.style.transform='none';st.style.minHeight='0';fb.style.height='0';
  const vw=fb.clientWidth||innerWidth,top=fb.getBoundingClientRect().top,vh=Math.max(120,innerHeight-top);let s=1;
  for(let k=0;k<3;k++){st.style.width=(vw/s)+'px';const h=st.offsetHeight||1;s=Math.min(1.8,Math.max(.25,vh/h*.985))}
  fb.style.height=vh+'px';st.style.width=(vw/s)+'px';st.style.minHeight=(vh/s)+'px';st.style.transformOrigin='0 0';st.style.transform='scale('+s+')';SC=s}
function pres(v){document.body.classList.toggle('pres',!!v);
  try{const d=document;if(v&&!d.fullscreenElement&&d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>{});
    if(!v&&d.fullscreenElement&&d.exitFullscreen)d.exitFullscreen().catch(()=>{})}catch(e){}
  fit()}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('pres')&&!document.body.dataset.fsurl)pres(0);else fit()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('ban').classList.remove('show');pres(0)}else if((e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey)pres(!document.body.classList.contains('pres'))});
addEventListener('resize',fit);
let ft;new MutationObserver(()=>{clearTimeout(ft);ft=setTimeout(fit,60)}).observe($('grid'),{childList:true});

/* ---------- background image ---------- */
const badBg=new Set();
function setBg(){const o=S.bg||{},el=$('vbg');let u=String(o.url||'').trim().replace(/["\\\n\r]/g,'');
  $('vdim').style.opacity=Math.min(90,Math.max(0,+o.dim||0))/100;
  if(o.on===false||!u){document.body.classList.remove('hasbg');el.style.backgroundImage='none';el.dataset.u='';return}
  if(badBg.has(u))u=BG_DEFAULT;
  if(el.dataset.u===u){document.body.classList.add('hasbg');return}
  el.dataset.u=u;const im=new Image();
  im.onload=()=>{if(el.dataset.u===u){el.style.backgroundImage='url("'+u+'")';document.body.classList.add('hasbg')}};
  im.onerror=()=>{if(el.dataset.u!==u)return;if(u!==BG_DEFAULT){badBg.add(u);el.dataset.u='';setBg()}else document.body.classList.remove('hasbg')};
  im.src=u}

/* ---------- live sync (Firebase Realtime Database, read-only here) ---------- */
let lastTs=0,lastN=null,firstDone=false,leadChg='',lastOk=0;
function setConn(s){const c=$('conn');$('lp').hidden=!(DB&&s);if(!DB){c.className='';c.textContent='Demo data · not connected';return}
  c.className=s?'ok':'off';c.textContent=s?'● Live':'○ Offline · showing last data'}
function live(m){const t=typeof m.tab==='number'&&m.tab>=0&&m.tab<=5?m.tab:cur;if(t!==cur)go(t);
  if(m.act==='replay')show('');else if(m.act==='rev')show('rev');else if(m.act==='conf')celebrate()}
async function pull(){if(!DB)return;
  try{
    const r=await fetch(DB+'/meta.json',{cache:'no-store'});if(!r.ok)throw 0;const m=(await r.json())||{};
    let changed=false;
    if(m.ts&&m.ts!==lastTs){const r2=await fetch(DB+'/state.json',{cache:'no-store'});if(!r2.ok)throw 0;const s=await r2.json();
      if(typeof s==='string'){const L0=standings()[0].i;S=norm(JSON.parse(s));const A0=standings()[0];leadChg=(firstDone&&A0.pts>0&&A0.i!==L0)?S.teams[A0.i].name:'';lastTs=m.ts;changed=true;try{localStorage.setItem(CK,s)}catch(e){}}}
    setConn(1);lastOk=Date.now();if(changed){const l=$('lp');l.classList.remove('flash');void l.offsetWidth;l.classList.add('flash')}
    if(!firstDone){firstDone=true;lastN=m.n||0;if(typeof m.tab==='number'&&m.tab>=0&&m.tab<=5)cur=m.tab;setBg();go(cur,true);return}
    if(changed){tabs();hdr();setBg();flip();if(leadChg){toast('👑 New leader: '+leadChg);if(!RM)confetti();leadChg=''}}
    if(m.n&&m.n!==lastN){lastN=m.n;live(m)}
  }catch(e){setConn(0)}}
function listen(){if(!DB||!window.EventSource)return;
  try{const es=new EventSource(DB+'/meta.json');let t;const f=()=>{clearTimeout(t);t=setTimeout(pull,120)};es.addEventListener('put',f);es.addEventListener('patch',f)}catch(e){}}


function countUp(q){document.querySelectorAll('.cnt').forEach(el=>{const v=+el.dataset.v;if(q){el.textContent=v;return}const d=(parseFloat(el.closest('.team').style.getPropertyValue('--d'))||0)*1000+500;setTimeout(()=>{const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)},d)})}
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#f0b429','#fff3c4','#ff5a36','#4cc9f0','#b8f26b','#ff7ad9'];let P=Array.from({length:170},()=>({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});P=P.filter(p=>p.y<c.height+20);if(P.length)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

const st=$('stage');for(let i=0;i<14;i++){const s=document.createElement('span');s.className='spark';s.style.left=Math.random()*100+'%';s.style.bottom='-10px';s.style.animationDelay=Math.random()*7+'s';s.style.animationDuration=5+Math.random()*5+'s';st.appendChild(s)}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),4000)}
setInterval(()=>{const a=$('ago');if(!DB||!lastOk){a.textContent='';return}const n=Math.round((Date.now()-lastOk)/1000);a.textContent=' · checked '+(n<3?'just now':n+'s ago')},1000);
if(matchMedia('(hover:hover)').matches&&!RM)addEventListener('pointermove',e=>{const o=$('spot').style;o.setProperty('--x',e.clientX+'px');o.setProperty('--y',e.clientY+'px');document.body.classList.add('hasptr')});
setConn(0);if(!DB)setConn(0);
setBg();go(0,true);
if(/[?&]fs(=1|&|$)/.test(location.search)){document.body.dataset.fsurl=1;document.body.classList.add('pres');fit()}

if(DB){pull();listen();setInterval(pull,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
</script>
</body>
</html>
